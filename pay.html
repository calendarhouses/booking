<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <title>BOSO | Оплата бронювання</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F7F5F2;
            --white: #FFFFFF;
            --accent: #556B2F;
            --accent-light: rgba(85,107,47,0.08);
            --accent-hover: #4B5D28;
            --text: #1A1A1A;
            --muted: #6B7280;
            --border: #E5E1DC;
            --success: #059669;
            --danger: #DC2626;
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .wrap {
            max-width: 480px;
            margin: 0 auto;
            padding: 28px 20px 48px;
        }
        .brand {
            text-align: center;
            margin-bottom: 28px;
        }
        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--accent);
        }
        .brand-sub {
            margin-top: 6px;
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
        }
        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 20px;
        }
        .meta {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--border);
        }
        .meta-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
        }
        .meta-row span:first-child { color: var(--muted); }
        .meta-row span:last-child { font-weight: 600; text-align: right; }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .pay-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-align: left;
            border: 1.5px solid var(--border);
            background: var(--white);
            border-radius: 14px;
            padding: 16px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .pay-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: var(--accent-light);
        }
        .pay-btn:disabled {
            opacity: 0.55;
            cursor: wait;
        }
        .pay-btn-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }
        .pay-btn-hint {
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
        }
        .pay-btn-amount {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent);
            white-space: nowrap;
        }
        .secure {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
        }
        .state {
            text-align: center;
            padding: 28px 12px;
        }
        .state h2 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            margin-bottom: 10px;
        }
        .state p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }
        .loader {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .alert {
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.45;
            background: #FEF2F2;
            color: #991B1B;
            border: 1px solid #FECACA;
        }
        .home-link {
            display: inline-block;
            margin-top: 18px;
            color: var(--accent);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }
        .home-link:hover { text-decoration: underline; }
        .retry-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .retry-btn:hover { background: var(--accent-hover); }
        .retry-btn.secondary {
            margin-top: 10px;
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--border);
        }

        /* Premium success (як на головній після бронювання) */
        .success-wrap { text-align: center; padding: 8px 4px 12px; }
        .success-icon-premium {
            width: 72px; height: 72px;
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: rgba(85,107,47,0.08);
            color: var(--accent);
        }
        .success-icon-premium svg { width: 36px; height: 36px; stroke-width: 1.5; }
        .success-wrap > h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .success-wrap > p {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.55;
            margin-bottom: 24px;
        }
        .success-receipt {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 18px;
            text-align: left;
            margin-bottom: 22px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.04);
        }
        .receipt-header {
            border-bottom: 1px dashed var(--border);
            padding-bottom: 14px;
            margin-bottom: 16px;
            text-align: center;
        }
        .receipt-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--muted);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .receipt-room {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .receipt-label { color: var(--muted); }
        .receipt-val { font-weight: 600; color: var(--text); text-align: right; }
        .receipt-pay-block {
            margin-top: 16px;
            padding: 16px 14px;
            border-radius: 14px;
            background: linear-gradient(180deg, #F7FAF3 0%, #F0F5EA 100%);
            border: 1px solid rgba(85, 107, 47, 0.18);
            text-align: center;
        }
        .receipt-pay-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #6B7280;
            margin-bottom: 8px;
        }
        .receipt-pay-amount {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.15;
        }
        .receipt-pay-rest {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(85, 107, 47, 0.25);
            font-size: 13px;
            color: var(--muted);
        }
        .receipt-pay-rest strong { color: var(--text); font-weight: 700; }
        .btn-tg {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 16px;
            background: var(--accent);
            color: #fff;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            text-decoration: none;
            transition: 0.3s;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(85, 107, 47, 0.25);
        }
        .btn-tg:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }
        .btn-tg svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }
        .btn-home-link {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
        }
        .btn-home-link:hover { color: var(--text); border-color: var(--text); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">
            <div class="brand-name">BOSO</div>
            <div class="brand-sub">Оплата бронювання</div>
        </div>
        <div class="card" id="app">
            <div class="state">
                <div class="loader"></div>
                <p>Завантажуємо дані бронювання…</p>
            </div>
        </div>
    </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx1RYoMJySplZ18Wv54PQjxzHnZqIb3Wsw63oG-PAOKMvuXEym8Y7aFS-L_pxvfX6o4DQ/exec";
const PAYMENT_CONFIRM_MAX_ATTEMPTS = 20;
const PAYMENT_CONFIRM_DELAY_MS = 2000;

const params = new URLSearchParams(window.location.search);
const bookingId = params.get('id') || params.get('orderId') || '';
const paymentParam = params.get('payment') || '';
const isPaymentReturn = paymentParam === 'return' || paymentParam === 'success';
const previewMode = (params.get('preview') || '').toLowerCase();

const app = document.getElementById('app');
let cachedBooking = null;

function money(n) {
    return Math.round(Number(n) || 0).toLocaleString('uk-UA') + ' грн';
}

function formatDateUa(iso) {
    if (!iso) return '—';
    const p = String(iso).slice(0, 10).split('-');
    if (p.length !== 3) return iso;
    return p[2] + '.' + p[1] + '.' + p[0];
}

function formatLongDateUa(iso) {
    if (!iso) return '—';
    try {
        const d = new Date(String(iso).slice(0, 10) + 'T12:00:00');
        if (isNaN(d.getTime())) return formatDateUa(iso);
        return d.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' });
    } catch (e) {
        return formatDateUa(iso);
    }
}

function guestWord(n) {
    const v = Math.abs(Number(n) || 0) % 100;
    const n1 = v % 10;
    if (v > 10 && v < 20) return 'гостей';
    if (n1 > 1 && n1 < 5) return 'гості';
    if (n1 === 1) return 'гість';
    return 'гостей';
}

const TG_CONCIERGE_HREF = 'tg://resolve?domain=bosohouses_bot&start=dzp4SnNlUkQyTw==';

function renderPremiumSuccess(opts) {
    const o = opts || {};
    const fullyPaid = !!o.fullyPaid;
    const totalPrice = Math.round(Number(o.totalPrice) || 0);
    const paidAmount = Math.round(Number(o.paidAmount) || 0);
    const balance = Math.round(Number(o.balance != null ? o.balance : Math.max(0, totalPrice - paidAmount)) || 0);
    const amountKind = o.amountKind || '';
    const justPaid = Math.round(Number(o.justPaidAmount != null ? o.justPaidAmount : paidAmount) || 0);

    let payLabel = 'Оплачено';
    if (fullyPaid || amountKind === 'full' || balance <= 0) payLabel = 'Сплачено повністю';
    else if (amountKind === 'remainder') payLabel = 'Оплачено залишок';
    else if (amountKind === 'prepay') payLabel = 'Внесено аванс';

    const title = (fullyPaid || balance <= 0) ? 'Оплачено повністю' : 'Оплату отримано';
    const subtitle = (fullyPaid || balance <= 0)
        ? 'Дякуємо! Бронювання повністю оплачене. Деталі нижче.'
        : 'Дякуємо! Платіж зараховано. Деталі нижче.';

    const guests = o.guests != null && o.guests !== '' ? o.guests : null;
    const bookingIdLabel = o.bookingId || '';

    setHtml(
        '<div class="success-wrap">' +
            '<div class="success-icon-premium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>' +
            '<h2>' + title + '</h2>' +
            '<p>' + subtitle + '</p>' +
            '<div class="success-receipt">' +
                '<div class="receipt-header">' +
                    '<div class="receipt-title">Бронь котеджу</div>' +
                    '<div class="receipt-room">' + (o.cottage || '—') + '</div>' +
                '</div>' +
                '<div class="receipt-row"><span class="receipt-label">Заїзд:</span><span class="receipt-val">' + formatLongDateUa(o.checkIn) + '</span></div>' +
                '<div class="receipt-row"><span class="receipt-label">Виїзд:</span><span class="receipt-val">' + formatLongDateUa(o.checkOut) + '</span></div>' +
                (guests != null
                    ? '<div class="receipt-row"><span class="receipt-label">Гості:</span><span class="receipt-val">' + guests + ' ' + guestWord(guests) + '</span></div>'
                    : '') +
                (bookingIdLabel
                    ? '<div class="receipt-row"><span class="receipt-label">№ броні:</span><span class="receipt-val">' + bookingIdLabel + '</span></div>'
                    : '') +
                (totalPrice > 0
                    ? '<div class="receipt-row"><span class="receipt-label">Вартість:</span><span class="receipt-val">' + money(totalPrice) + '</span></div>'
                    : '') +
                '<div class="receipt-pay-block">' +
                    '<div class="receipt-pay-label">' + payLabel + '</div>' +
                    '<div class="receipt-pay-amount">' + money(justPaid > 0 ? justPaid : paidAmount) + '</div>' +
                    (balance > 0
                        ? '<div class="receipt-pay-rest">Залишок при заселенні: <strong>' + money(balance) + '</strong></div>'
                        : '') +
                '</div>' +
            '</div>' +
            '<a href="' + TG_CONCIERGE_HREF + '" class="btn-tg">' +
                '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.11.03-1.84 1.18-5.18 3.44-.49.33-.93.49-1.33.48-.44-.01-1.28-.24-1.91-.44-.77-.24-1.38-.37-1.32-.78.03-.22.34-.44.93-.68 3.63-1.58 6.06-2.63 7.28-3.13 3.47-1.42 4.18-1.67 4.65-1.68.1 0 .33.02.45.1.1.06.13.14.14.21-.01.04-.01.12-.02.21z"/></svg>' +
                'Телеграм Консьєрж' +
            '</a>' +
            '<a href="' + homeHref() + '" class="btn-home-link">Забронювати ще один котедж</a>' +
        '</div>'
    );
}

function setHtml(html) {
    app.innerHTML = html;
}

function homeHref() {
    return window.innerWidth < 768 ? 'mobile.html' : 'index.html';
}

async function fetchPaymentPage(id) {
    const res = await fetch(API_URL + '?action=paymentPage&id=' + encodeURIComponent(id) + '&t=' + Date.now());
    return res.json();
}

async function waitForPayment(id, previousPaid) {
    const prev = Math.round(Number(previousPaid) || 0);
    for (let i = 0; i < PAYMENT_CONFIRM_MAX_ATTEMPTS; i++) {
        try {
            const res = await fetch(API_URL + '?action=checkStatus&orderId=' + encodeURIComponent(id) + '&t=' + Date.now());
            const data = await res.json();
            const paid = Math.round(Number(data.paidAmount) || 0);
            if (data.status === 'Підтверджено' && (paid > prev || data.balance === 0)) {
                return data;
            }
            if (paid > prev) return data;
        } catch (e) {}
        await new Promise(r => setTimeout(r, PAYMENT_CONFIRM_DELAY_MS));
    }
    return null;
}

function submitWfpForm(pd, guestName, guestPhone) {
    const parts = String(guestName || '').trim().split(/\s+/);
    const firstName = parts[0] || 'Гість';
    const lastName = parts.slice(1).join(' ') || 'BOSO';

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = 'https://secure.wayforpay.com/pay';
    form.style.display = 'none';

    const paramsMap = {
        merchantAccount: pd.merchantAccount,
        merchantDomainName: pd.merchantDomainName,
        merchantSignature: pd.signature,
        orderReference: pd.orderReference,
        orderDate: pd.orderDate,
        amount: pd.amount,
        currency: pd.currency || 'UAH',
        clientFirstName: firstName,
        clientLastName: lastName,
        clientPhone: guestPhone || '',
        language: 'UA',
        returnUrl: pd.returnUrl || (window.location.origin + '/pay.html?payment=return&id=' + encodeURIComponent(bookingId))
    };

    Object.keys(paramsMap).forEach(function(key) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = paramsMap[key];
        form.appendChild(input);
    });

    const arrayParams = {
        'productName[]': pd.productName,
        'productPrice[]': pd.amount,
        'productCount[]': pd.productCount || 1
    };
    Object.keys(arrayParams).forEach(function(key) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = arrayParams[key];
        form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
}

async function startCharge(amountKind, booking) {
    const buttons = app.querySelectorAll('.pay-btn');
    buttons.forEach(b => { b.disabled = true; });
    setHtml('<div class="state"><div class="loader"></div><p>Переходимо до безпечної оплати…</p></div>');

    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
                action: 'createWfpCharge',
                bookingId: booking.bookingId,
                amountKind: amountKind
            })
        });
        const json = await res.json();
        if (!json.success || !json.paymentData) {
            const msg = ({
                NOT_FOUND: 'Бронювання не знайдено',
                CANCELLED: 'Бронювання скасовано',
                NO_REMAINDER: 'Залишку до сплати немає',
                ALREADY_PAID: 'Оплату вже отримано',
                ZERO_AMOUNT: 'Сума оплати некоректна'
            })[json.error] || 'Не вдалося створити оплату';
            renderChooser(booking, msg);
            return;
        }

        // Оновлюємо lastBooking під фактичну суму (для чека після повернення)
        try {
            const raw = sessionStorage.getItem('lastBooking');
            const lb = raw ? JSON.parse(raw) : {};
            lb.orderId = booking.bookingId;
            lb._paidBeforeCharge = booking.paidAmount;
            lb.prepayment = json.paymentData.amount;
            lb.paidAmount = json.paymentData.amount;
            lb.amountKind = amountKind;
            lb.totalPrice = booking.totalPrice;
            lb.cottage = booking.cottage;
            lb.checkIn = booking.checkIn;
            lb.checkOut = booking.checkOut;
            if (!lb.source) lb.source = 'Сайт';
            sessionStorage.setItem('lastBooking', JSON.stringify(lb));
        } catch (e) {}

        submitWfpForm(json.paymentData, booking.name, '');
    } catch (e) {
        renderChooser(booking, 'Помилка зʼєднання. Спробуйте ще раз.');
    }
}

function renderChooser(booking, errorText) {
    if (booking.cancelled) {
        setHtml(
            '<div class="state"><h2>Бронювання скасовано</h2><p>Онлайн-оплата недоступна для цієї броні.</p>' +
            '<a class="home-link" href="' + homeHref() + '">На головну</a></div>'
        );
        return;
    }

    if (booking.balance <= 0 && booking.paidAmount > 0) {
        renderPremiumSuccess({
            fullyPaid: true,
            bookingId: booking.bookingId,
            cottage: booking.cottage,
            checkIn: booking.checkIn,
            checkOut: booking.checkOut,
            guests: booking.guests,
            totalPrice: booking.totalPrice,
            paidAmount: booking.paidAmount,
            balance: 0,
            amountKind: 'full',
            justPaidAmount: booking.paidAmount
        });
        return;
    }

    let actions = '';
    if (booking.canPayRemainder) {
        actions +=
            '<button type="button" class="pay-btn" data-kind="remainder">' +
            '<div><div class="pay-btn-title">Оплатити залишок</div>' +
            '<div class="pay-btn-hint">Доплата онлайн через WayForPay</div></div>' +
            '<div class="pay-btn-amount">' + money(booking.balance) + '</div></button>';
    } else {
        if (booking.canPayPrepay) {
            actions +=
                '<button type="button" class="pay-btn" data-kind="prepay">' +
                '<div><div class="pay-btn-title">Передплата</div>' +
                '<div class="pay-btn-hint">50% · решту можна сплатити пізніше' + (booking.testMode ? ' · тест' : '') + '</div></div>' +
                '<div class="pay-btn-amount">' + money(booking.prepayAmount) + '</div></button>';
        }
        if (booking.canPayFull && Number(booking.fullAmount || booking.totalPrice) !== Number(booking.prepayAmount)) {
            actions +=
                '<button type="button" class="pay-btn" data-kind="full">' +
                '<div><div class="pay-btn-title">Повна оплата</div>' +
                '<div class="pay-btn-hint">Уся сума бронювання одразу' + (booking.testMode ? ' · тест' : '') + '</div></div>' +
                '<div class="pay-btn-amount">' + money(booking.fullAmount != null ? booking.fullAmount : booking.totalPrice) + '</div></button>';
        }
    }

    if (!actions) {
        setHtml(
            '<div class="state"><h2>Оплата недоступна</h2><p>За цією бронею немає доступної суми для онлайн-оплати.</p>' +
            '<a class="home-link" href="' + homeHref() + '">На головну</a></div>'
        );
        return;
    }

    setHtml(
        (errorText ? '<div class="alert">' + errorText + '</div>' : '') +
        '<div class="meta">' +
            '<div class="meta-row"><span>Котедж</span><span>' + (booking.cottage || '—') + '</span></div>' +
            '<div class="meta-row"><span>Заїзд</span><span>' + formatDateUa(booking.checkIn) + '</span></div>' +
            '<div class="meta-row"><span>Виїзд</span><span>' + formatDateUa(booking.checkOut) + '</span></div>' +
            '<div class="meta-row"><span>№ броні</span><span>' + booking.bookingId + '</span></div>' +
            '<div class="meta-row"><span>Вартість</span><span>' + money(booking.totalPrice) + '</span></div>' +
            (booking.paidAmount > 0
                ? '<div class="meta-row"><span>Вже сплачено</span><span>' + money(booking.paidAmount) + '</span></div>' +
                  '<div class="meta-row"><span>Залишок</span><span>' + money(booking.balance) + '</span></div>'
                : '') +
        '</div>' +
        '<div class="section-title">Оплатити зараз</div>' +
        actions +
        '<div class="secure">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3 5 6v6c0 5 3.2 8.4 7 9 3.8-.6 7-4 7-9V6l-7-3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>' +
            'Безпечна оплата WayForPay' +
        '</div>'
    );

    app.querySelectorAll('.pay-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            startCharge(btn.getAttribute('data-kind'), booking);
        });
    });
}

async function handleSuccessReturn(id) {
    setHtml('<div class="state"><div class="loader"></div><p>Підтверджуємо оплату…</p></div>');

    let previousPaid = 0;
    let preferredKind = '';
    try {
        const lb = JSON.parse(sessionStorage.getItem('lastBooking') || '{}');
        if (lb && lb.orderId === id && lb._paidBeforeCharge != null) {
            previousPaid = Number(lb._paidBeforeCharge) || 0;
        } else if (lb && lb.orderId === id && (lb.amountKind === 'prepay' || lb.amountKind === 'full')) {
            previousPaid = 0;
        }
        if (lb && lb.orderId === id) preferredKind = lb.amountKind || '';
    } catch (e) {}

    // Після редіректу з WFP сторінка нова — підтягнемо деталі броні для чека
    if (!cachedBooking) {
        try {
            const page = await fetchPaymentPage(id);
            if (page && page.success) cachedBooking = page;
        } catch (e) {}
    }

    const confirmed = await waitForPayment(id, previousPaid);
    if (!confirmed) {
        renderPaymentFailed(id, preferredKind);
        return;
    }

    goToSuccessPage(id, confirmed);
}

function goToSuccessPage(id, confirmed) {
    const lastBookingStr = sessionStorage.getItem('lastBooking');
    let isSiteFirstPay = false;
    let amountKind = '';
    let previousPaid = 0;
    try {
        const lb = JSON.parse(lastBookingStr || '{}');
        isSiteFirstPay = lb && lb.orderId === id && lb.source === 'Сайт' &&
            (lb.amountKind === 'prepay' || lb.amountKind === 'full' || !lb.amountKind);
        if (lb && lb.orderId === id) {
            amountKind = lb.amountKind || '';
            previousPaid = Number(lb._paidBeforeCharge) || 0;
        }
        if (lb && confirmed) {
            if (confirmed.paidAmount != null) lb.paidAmount = confirmed.paidAmount;
            if (lb.amountKind === 'full' || Number(confirmed.balance) === 0) {
                lb.prepayment = Number(lb.totalPrice) || Number(confirmed.paidAmount) || lb.prepayment;
            }
            sessionStorage.setItem('lastBooking', JSON.stringify(lb));
        }
    } catch (e) {}

    if (isSiteFirstPay && lastBookingStr) {
        try { localStorage.setItem('lastBooking', sessionStorage.getItem('lastBooking')); } catch (e) {}
        // paid=1 — головна вже НЕ чекає оплату повторно (без другого прелоадера)
        window.location.href = homeHref() + '?paid=1';
        return;
    }

    const b = cachedBooking || {};
    const paidAmount = Math.round(Number(confirmed.paidAmount != null ? confirmed.paidAmount : b.paidAmount) || 0);
    const totalPrice = Math.round(Number(confirmed.totalPrice != null ? confirmed.totalPrice : b.totalPrice) || 0);
    const balance = Math.round(Number(confirmed.balance != null ? confirmed.balance : Math.max(0, totalPrice - paidAmount)) || 0);
    const justPaid = Math.max(0, paidAmount - previousPaid) || paidAmount;

    renderPremiumSuccess({
        fullyPaid: balance <= 0,
        bookingId: id || b.bookingId,
        cottage: confirmed.cottage || b.cottage,
        checkIn: confirmed.checkIn || b.checkIn,
        checkOut: confirmed.checkOut || b.checkOut,
        guests: confirmed.guests != null ? confirmed.guests : b.guests,
        totalPrice: totalPrice,
        paidAmount: paidAmount,
        balance: balance,
        amountKind: amountKind,
        justPaidAmount: justPaid
    });
}

function renderPaymentFailed(id, preferredKind) {
    setHtml(
        '<div class="state">' +
            '<h2>Оплату не підтверджено</h2>' +
            '<p>Платіж не завершився або ще не надійшов. Можете спробувати ще раз — ми створимо нове безпечне посилання на оплату.</p>' +
            '<button type="button" class="retry-btn" id="retryPayBtn">Спробувати ще раз</button>' +
            '<button type="button" class="retry-btn secondary" id="checkAgainBtn">Перевірити ще раз</button>' +
            '<a class="home-link" href="' + homeHref() + '">На головну</a>' +
        '</div>'
    );

    document.getElementById('retryPayBtn').addEventListener('click', async function() {
        setHtml('<div class="state"><div class="loader"></div><p>Готуємо нову оплату…</p></div>');
        try {
            const data = await fetchPaymentPage(id);
            if (!data.success) {
                setHtml('<div class="state"><h2>Бронювання не знайдено</h2><a class="home-link" href="' + homeHref() + '">На головну</a></div>');
                return;
            }
            cachedBooking = data;
            // Прибираємо payment= з URL, щоб не зациклити return-стан
            try {
                window.history.replaceState({}, document.title, 'pay.html?id=' + encodeURIComponent(id));
            } catch (e) {}

            let kind = preferredKind || '';
            if (kind === 'remainder' && !data.canPayRemainder) kind = '';
            if ((kind === 'prepay' || kind === 'full') && data.paidAmount > 0) kind = '';
            if (!kind) {
                if (data.canPayRemainder) kind = 'remainder';
                else if (data.canPayPrepay) kind = 'prepay';
                else if (data.canPayFull) kind = 'full';
            }

            if (!kind) {
                renderChooser(data, 'Немає доступної суми для повторної оплати.');
                return;
            }

            // Якщо є вибір (prepay vs full) — показуємо кнопки; інакше одразу charge
            if (!data.canPayRemainder && data.canPayPrepay && data.canPayFull) {
                renderChooser(data, 'Оберіть суму та спробуйте оплату ще раз.');
                return;
            }
            await startCharge(kind, data);
        } catch (e) {
            setHtml(
                '<div class="state"><h2>Помилка</h2><p>Не вдалося підготувати оплату. Спробуйте оновити сторінку.</p>' +
                '<button type="button" class="retry-btn" onclick="location.href=\'pay.html?id=' + encodeURIComponent(id) + '\'">Спробувати ще раз</button></div>'
            );
        }
    });

    document.getElementById('checkAgainBtn').addEventListener('click', function() {
        handleSuccessReturn(id);
    });
}

async function init() {
    // Прев’ю екранів без WayForPay: ?preview=ok | ok-full | fail
    if (previewMode === 'ok' || previewMode === 'success') {
        renderPremiumSuccess({
            fullyPaid: false,
            bookingId: 'B-123',
            cottage: 'JUNIOR 1',
            checkIn: '2026-08-10',
            checkOut: '2026-08-13',
            guests: 2,
            totalPrice: 7000,
            paidAmount: 3500,
            balance: 3500,
            amountKind: 'prepay',
            justPaidAmount: 3500
        });
        return;
    }
    if (previewMode === 'ok-full' || previewMode === 'full') {
        renderPremiumSuccess({
            fullyPaid: true,
            bookingId: 'B-123',
            cottage: 'JUNIOR 1',
            checkIn: '2026-08-10',
            checkOut: '2026-08-13',
            guests: 2,
            totalPrice: 7000,
            paidAmount: 7000,
            balance: 0,
            amountKind: 'full',
            justPaidAmount: 7000
        });
        return;
    }
    if (previewMode === 'fail' || previewMode === 'error') {
        renderPaymentFailed('B-PREVIEW', 'remainder');
        return;
    }

    if (!bookingId) {
        setHtml(
            '<div class="state"><h2>Немає номера броні</h2><p>Перевірте посилання на оплату.</p>' +
            '<a class="home-link" href="' + homeHref() + '">На головну</a></div>'
        );
        return;
    }

    if (isPaymentReturn) {
        await handleSuccessReturn(bookingId);
        return;
    }

    try {
        const data = await fetchPaymentPage(bookingId);
        if (!data.success) {
            setHtml(
                '<div class="state"><h2>Бронювання не знайдено</h2><p>Перевірте посилання або зверніться до адміністратора.</p>' +
                '<a class="home-link" href="' + homeHref() + '">На головну</a></div>'
            );
            return;
        }

        cachedBooking = data;

        try {
            const raw = sessionStorage.getItem('lastBooking');
            const lb = raw ? JSON.parse(raw) : { orderId: data.bookingId, source: 'Сайт' };
            lb.orderId = data.bookingId;
            lb._paidBeforeCharge = data.paidAmount;
            lb.totalPrice = data.totalPrice;
            lb.cottage = data.cottage;
            lb.checkIn = data.checkIn;
            lb.checkOut = data.checkOut;
            if (!lb.source) lb.source = 'Сайт';
            sessionStorage.setItem('lastBooking', JSON.stringify(lb));
        } catch (e) {}

        renderChooser(data);
    } catch (e) {
        setHtml(
            '<div class="state"><h2>Помилка завантаження</h2><p>Спробуйте оновити сторінку.</p>' +
            '<a class="home-link" href="' + homeHref() + '">На головну</a></div>'
        );
    }
}

init();
</script>
